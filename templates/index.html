<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерьер Дизайн Render Систем</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 10px; background: #f4f4f9; }
        .instructions { font-size: 13px; color: #555; margin-bottom: 10px; }
        .main-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        .panel { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 450px; width: 100%; }
        
        .workspace { position: relative; display: inline-block; width: 100%; max-width: 400px; }
        canvas, img#resultImg { width: 100% !important; height: auto !important; border: 1px solid #ccc; border-radius: 4px; display: block; }
        
        .furniture-palette { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
        .furniture-item { cursor: pointer; border: 2px solid #ddd; border-radius: 5px; padding: 5px; background: #fff; width: 50px; height: 50px; object-fit: contain; }
        .furniture-item:hover { border-color: #007bff; }

        .placed-furniture {
            position: absolute;
            cursor: move;
            user-select: none;
            width: 100px;
            transform-origin: center;
            border: 1px dashed transparent;
            touch-action: none; /* Гар утсан дээр дэлгэц гүйхээс сэргийлнэ */
        }
        .placed-furniture:hover { border-color: #007bff; }

        button { padding: 8px 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-size: 13px; }
        button.active { background: #007bff; }
        button.secondary { background: #dc3545; }
        .placeholder-text { width: 100%; height: 250px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #888; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>🛋️ Интерьер Дизайн & Floor Render Систем</h2>
    <div class="instructions">
        💡 <b>Заавар:</b> Зургийг оруулаад шалны 4 буланг тэмдэглэнэ. Тавилга нэмж хуруугаар болон хулганаар чирч байрлуулна уу.
    </div>
    <input type="file" id="imageInput" accept="image/*"><br>

    <div class="main-container">
        <div class="panel">
            <h3>1. Өрөөний тохижилт</h3>
            <div class="furniture-palette">
                <img src="/static/furniture/wardrobe.png" class="furniture-item" onclick="addFurniture('/static/furniture/wardrobe.png')" title="Шкаф">
                <img src="/static/furniture/fridge.png" class="furniture-item" onclick="addFurniture('/static/furniture/fridge.png')" title="Хөргөгч">
                <img src="/static/furniture/table.png" class="furniture-item" onclick="addFurniture('/static/furniture/table.png')" title="Ширээ">
                <img src="/static/furniture/sink.png" class="furniture-item" onclick="addFurniture('/static/furniture/sink.png')" title="Угаалтуур">
            </div>

            <div class="workspace" id="workspaceContainer">
                <canvas id="roomCanvas"></canvas>
            </div>

            <div>
                <button id="modeBtn" class="active">➕ Цэг тавих</button>
                <button id="processBtn">✨ Render хийх</button>
                <button id="resetBtn" class="secondary">Цэвэрлэх</button>
            </div>
        </div>

        <div class="panel">
            <h3>2. Эцсийн Render үр дүн</h3>
            <div class="placeholder-text" id="placeholder">Render хийсний дараа энд гарна</div>
            <img id="resultImg" alt="Render үр дүн" style="display:none;">
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('roomCanvas');
        const ctx = canvas.getContext('2d');
        const modeBtn = document.getElementById('modeBtn');
        const processBtn = document.getElementById('processBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultImg = document.getElementById('resultImg');
        const placeholder = document.getElementById('placeholder');
        const workspaceContainer = document.getElementById('workspaceContainer');

        let img = new Image();
        let points = [];
        let isAddMode = true;

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            fetch('/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        const reader = new FileReader();
                        reader.onload = (event) => { img.src = event.target.result; }
                        reader.readAsDataURL(file);
                    }
                });
        });

        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            points = [];
            drawImage();
        };

        modeBtn.addEventListener('click', () => {
            isAddMode = !isAddMode;
            modeBtn.innerText = isAddMode ? "➕ Цэг тавих" : "🛋️ Тавилга зөөх";
            modeBtn.classList.toggle('active', isAddMode);
        });

        canvas.addEventListener('click', (e) => {
            if (!isAddMode) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            points.push({
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            });
            drawImage();
        });

        function drawImage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            if (points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                if(points.length > 2) ctx.closePath();
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.stroke();

                points.forEach((p, idx) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#007bff';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px Arial';
                    ctx.fillText(idx + 1, p.x - 4, p.y + 4);
                });
            }
        }

        // Тавилга нэмэх (Гар утас болон Компьютер дээр чирч зөөх)
        function addFurniture(src) {
            const el = document.createElement('img');
            el.src = src;
            el.className = 'placed-furniture';
            el.style.left = '20px';
            el.style.top = '20px';
            el.dataset.src = src;

            let isDragging = false;
            let startX, startY;

            // Pointer events - Гар утасны хуруу болон хулганыг хоёуланг нь дэмжинэ
            el.addEventListener('pointerdown', (e) => {
                if (isAddMode) return; // Цэг тавих горимд байвал хөдөлгөхгүй
                isDragging = true;
                startX = e.clientX - el.offsetLeft;
                startY = e.clientY - el.offsetTop;
                try { el.setPointerCapture(e.pointerId); } catch(err) {}
                e.stopPropagation();
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                el.style.left = (e.clientX - startX) + 'px';
                el.style.top = (e.clientY - startY) + 'px';
            });

            window.addEventListener('pointerup', (e) => {
                if (isDragging) {
                    isDragging = false;
                    try { el.releasePointerCapture(e.pointerId); } catch(err) {}
                }
            });

            // Компьютер дээр Scroll хийж хэмжээ өөрчлөх
            el.addEventListener('wheel', (e) => {
                e.preventDefault();
                let currentWidth = el.offsetWidth;
                if (e.deltaY < 0) {
                    el.style.width = (currentWidth + 10) + 'px';
                } else {
                    el.style.width = Math.max(30, currentWidth - 10) + 'px';
                }
            });

            // Давхар товшиж устгах
            el.addEventListener('dblclick', () => {
                if(confirm('Энэ тавилгыг устгах уу?')) el.remove();
            });

            workspaceContainer.appendChild(el);
        }

        resetBtn.addEventListener('click', () => {
            points = [];
            drawImage();
            resultImg.style.display = 'none';
            placeholder.style.display = 'flex';
            document.querySelectorAll('.placed-furniture').forEach(el => el.remove());
        });

        // Render хийх хүсэлт
        processBtn.addEventListener('click', () => {
            if (points.length < 4) {
                alert('Яг 4 булангийн цэгийг сонгоно уу!');
                return;
            }

            const furnitureElements = document.querySelectorAll('.placed-furniture');
            const furnitureData = [];

            furnitureElements.forEach(el => {
                furnitureData.push({
                    src: el.dataset.src,
                    x: (el.offsetLeft),
                    y: (el.offsetTop),
                    width: el.offsetWidth,
                    height: el.offsetHeight
                });
            });

            processBtn.innerText = "Rendering хийж байна...";
            processBtn.disabled = true;
            
            fetch('/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    points: points,
                    furniture: furnitureData,
                    canvasWidth: canvas.width,
                    canvasHeight: canvas.height
                })
            })
            .then(res => res.json())
            .then(data => {
                processBtn.innerText = "✨ Render хийх";
                processBtn.disabled = false;
                if (data.success) {
                    resultImg.src = data.resultUrl;
                    resultImg.style.display = 'block';
                    placeholder.style.display = 'none';
                } else {
                    alert('Алдаа гарлаа: ' + data.error);
                }
            })
            .catch(err => {
                processBtn.innerText = "✨ Render хийх";
                processBtn.disabled = false;
                alert('Сервертэй холбогдоход алдаа гарлаа.');
            });
        });
    </script>
</body>
</html>
