<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олон өнцөгт паркет суулгах систем (Бодит хэтийн төлөв)</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 10px; background: #f4f4f9; }
        .instructions { font-size: 13px; color: #555; margin-bottom: 10px; }
        .main-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        .panel { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        canvas, img#resultImg { width: 100% !important; height: auto !important; border: 1px solid #ccc; border-radius: 4px; cursor: crosshair; }
        button { padding: 8px 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-size: 13px; }
        button.active { background: #007bff; }
        button.secondary { background: #dc3545; }
        .placeholder-text { width: 100%; height: 250px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #888; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Шал солих систем (OpenCV Perspective)</h2>
    <div class="instructions">
        💡 <b>Заавар:</b> Зургийг сонгоод <b>"Горим: Асаалттай"</b> товчийг дарж шалны <b>4 булан</b>-г дарааллаар нь (Жишээ нь: Ойрын зүүн -> Ойрын баруун -> Цаад баруун -> Цаад зүүн) тэмдэглээд <b>"Шал солих"</b> товчийг дарна уу.
    </div>
    <input type="file" id="imageInput" accept="image/*"><br>

    <div class="main-container">
        <div class="panel">
            <h3>1. Хүрээ зурах (4 булан)</h3>
            <canvas id="roomCanvas"></canvas>
            <div>
                <button id="modeBtn" class="active">➕ Горим: Асаалттай</button>
                <button id="processBtn">Шал солих</button>
                <button id="resetBtn" class="secondary">Цэвэрлэх</button>
            </div>
        </div>

        <div class="panel">
            <h3>2. Үр дүн</h3>
            <div class="placeholder-text" id="placeholder">Үр дүн энд харагдана</div>
            <img id="resultImg" alt="Үр дүн" style="display:none;">
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('roomCanvas');
        const ctx = canvas.getContext('2d');
        const modeBtn = document.getElementById('modeBtn');
        const processBtn = document.getElementById('processBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultImg = document.getElementById('resultImg');
        const placeholder = document.getElementById('placeholder');

        let img = new Image();
        let points = [];
        let isAddMode = true;

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            fetch('/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        const reader = new FileReader();
                        reader.onload = (event) => { img.src = event.target.result; }
                        reader.readAsDataURL(file);
                    }
                });
        });

        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            points = [];
            drawImage();
        };

        modeBtn.addEventListener('click', () => {
            isAddMode = !isAddMode;
            modeBtn.innerText = isAddMode ? "➕ Горим: Асаалттай" : "➕ Горим: Унтраалттай";
            modeBtn.classList.toggle('active', isAddMode);
        });

        canvas.addEventListener('click', (e) => {
            if (!isAddMode) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            points.push({
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            });
            drawImage();
        });

        function drawImage() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            if (points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                if(points.length > 2) ctx.closePath();
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.stroke();

                points.forEach((p, idx) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#007bff';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px Arial';
                    ctx.fillText(idx + 1, p.x - 4, p.y + 4);
                });
            }
        }

        resetBtn.addEventListener('click', () => {
            points = [];
            drawImage();
            resultImg.style.display = 'none';
            placeholder.style.display = 'flex';
        });

        processBtn.addEventListener('click', () => {
            if (points.length < 4) {
                alert('Яг 4 булангийн цэгийг сонгоно уу!');
                return;
            }

            processBtn.innerText = "Боловсруулж байна...";
            processBtn.disabled = true;
            
            fetch('/process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ points: points })
            })
            .then(res => res.json())
            .then(data => {
                processBtn.innerText = "Шал солих";
                processBtn.disabled = false;
                if (data.success) {
                    resultImg.src = data.resultUrl;
                    resultImg.style.display = 'block';
                    placeholder.style.display = 'none';
                } else {
                    alert('Алдаа гарлаа: ' + data.error);
                }
            })
            .catch(err => {
                processBtn.innerText = "Шал солих";
                processBtn.disabled = false;
                alert('Сервертэй холбогдоход алдаа гарлаа.');
            });
        });
    </script>
</body>
</html>
